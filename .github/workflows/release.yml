name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows-x64
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - platform: macos-15
            artifact: macos-apple-silicon
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-15-intel
            artifact: macos-intel
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: macos-15-intel
            artifact: macos-universal
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      NOMAD_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsecret-1-dev patchelf rpm dpkg-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure updater signing
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before building releases." >&2
            exit 1
          fi

      - name: Build macOS universal app slices
        if: matrix.artifact == 'macos-universal'
        run: |
          npm run tauri -- build --target aarch64-apple-darwin --bundles app
          npm run tauri -- build --target x86_64-apple-darwin --bundles app

      - name: Build installer bundles
        shell: bash
        run: |
          if [[ "${{ matrix.artifact }}" == "macos-universal" ]]; then
            npm run tauri -- build --target universal-apple-darwin --bundles dmg
          else
            npm run tauri -- build --target "${{ matrix.target }}"
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nomad-${{ matrix.artifact }}
          path: |
            src-tauri/target/*/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download signed bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create signed update feed
        run: node scripts/create-updater-json.mjs artifacts "${{ github.repository }}" "${{ github.ref_name }}" release-assets

      - name: Publish installers and update feed
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
